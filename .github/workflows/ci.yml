name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Generate temporary webhook secret
        run: |
          ci_webhook_secret=$(openssl rand -hex 32)
          echo "::add-mask::$ci_webhook_secret"
          echo "WEBHOOK_SECRET=$ci_webhook_secret" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: python -m pip install -e '.[test,dev]'
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest -q
      - name: Build and start
        run: |
          docker compose build
          docker compose up -d --wait
          docker compose ps
      - name: Check image hygiene
        run: |
          python - <<'PY'
          import json
          import subprocess
          image_id = subprocess.check_output(["docker", "compose", "images", "-q", "api"], text=True).strip()
          metadata = json.loads(subprocess.check_output(["docker", "image", "inspect", image_id], text=True))[0]
          assert not any(item.startswith("WEBHOOK_SECRET=") for item in metadata["Config"]["Env"])
          PY
          docker compose exec -T api python - <<'PYIMAGE'
          from pathlib import Path
          root = Path('/app')
          assert not any((root / p).exists() for p in ['.env', 'payments.db', '.git', '.venv', '.pytest_cache', '.ruff_cache'])
          caches = [str(p.relative_to(root)) for folder in ['app', 'migrations'] for p in (root / folder).rglob('*.pyc')]
          assert not caches, caches
          print('Image hygiene passed')
          PYIMAGE
      - name: Test container API
        run: python tests/smoke_api.py
      - name: Recreate containers and check persistence
        run: |
          docker compose stop
          docker compose logs --no-color api | python -c "import sys; assert 'Application shutdown complete' in sys.stdin.read(); print('Graceful shutdown confirmed')"
          docker compose down
          docker compose up -d --wait
          docker compose ps
          python tests/smoke_api.py --check-persistence
      - name: Logs
        if: failure()
        run: docker compose logs
      - name: Cleanup
        if: always()
        run: docker compose down -v
