name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Generate temporary webhook secret
        run: echo "WEBHOOK_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: python -m pip install -e '.[test,dev]'
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest -q
      - name: Build and start
        run: docker compose up --build -d --wait
      - name: Test container API
        run: python tests/smoke_api.py
      - name: Restart and check persistence
        run: |
          docker compose restart
          docker compose up -d --wait
          python tests/smoke_api.py --check-persistence
      - name: Logs
        if: failure()
        run: docker compose logs
      - name: Cleanup
        if: always()
        run: docker compose down -v
